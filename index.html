<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinto Technologies — Tech Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="hub-header">
      <div class="wordmark">
        <span class="wordmark-main">DINTO</span>
        <span class="wordmark-sub">Electric</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span class="hub-label">Tech Hub</span>
      <div class="auth-area" id="authArea"></div>
    </header>

    <main class="hub-main">

      <!-- Landing: login form + public bypass -->
      <section id="landingView" class="landing-view" hidden>
        <div class="login-card">
          <h1>Sign in</h1>
          <p class="hub-subtitle">Sign in to view Beta apps, or continue to the public hub (Live apps only).</p>
          <form id="loginForm" class="admin-form">
            <div class="field">
              <label for="loginUsername">Username</label>
              <input class="input" id="loginUsername" name="username" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            </div>
            <p class="form-error" id="loginError" hidden></p>
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
          </form>
          <button class="btn btn-ghost btn-block" id="bypassBtn">Continue without signing in →</button>
        </div>
      </section>

      <!-- Hub: public / viewer / admin all share this -->
      <section id="hubView" hidden>
        <div class="hub-title">
          <h1>Dinto Technologies</h1>
          <p class="hub-subtitle" id="hubSubtitle"></p>
        </div>

        <div class="widgets-row">
          <div class="widget-card weather-widget">
            <h3>Weather</h3>
            <form id="weatherForm" class="weather-form">
              <input class="input" id="weatherZipInput" name="zip" placeholder="Zip code" maxlength="5" inputmode="numeric" pattern="[0-9]{5}">
              <button class="btn btn-ghost" type="submit">Go</button>
            </form>
            <div id="weatherDisplay" class="weather-display"></div>
            <p class="form-error" id="weatherError" hidden></p>
          </div>

          <div class="widget-card calendar-widget">
            <div class="calendar-header">
              <button class="btn btn-ghost btn-icon" id="calendarPrevBtn" aria-label="Previous month">‹</button>
              <h3 id="calendarLabel"></h3>
              <button class="btn btn-ghost btn-icon" id="calendarNextBtn" aria-label="Next month">›</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="calendar-day-panel" id="calendarDayPanel"></div>
          </div>
        </div>

        <div class="app-grid" id="appGrid"></div>
      </section>

      <!-- Admin-only management panel -->
      <section id="adminPanel" class="admin-panel" hidden>
        <div class="admin-block">
          <h2>Add an app</h2>
          <form id="addAppForm" class="admin-form admin-form-row">
            <input class="input" name="name" placeholder="App name" required>
            <input class="input" name="url" placeholder="https://example.netlify.app/" required>
            <input class="input" name="blurb" placeholder="One-line description">
            <select class="input" name="status">
              <option value="Beta" selected>Beta</option>
              <option value="Live">Live</option>
            </select>
            <button class="btn btn-primary" type="submit">Add</button>
          </form>
          <p class="form-error" id="addAppError" hidden></p>
          <div id="adminAppList" class="admin-list"></div>
        </div>

        <div class="admin-block">
          <h2>Viewer accounts</h2>
          <p class="hub-subtitle">Viewers can sign in to see Beta apps but can't edit anything.</p>
          <form id="addViewerForm" class="admin-form admin-form-row">
            <input class="input" name="username" placeholder="Username" autocomplete="off" required>
            <input class="input" name="password" placeholder="Password (min 8 characters)" type="password" autocomplete="new-password" required minlength="8">
            <button class="btn btn-primary" type="submit">Create</button>
          </form>
          <p class="form-error" id="addViewerError" hidden></p>
          <div id="viewerList" class="admin-list"></div>
        </div>
      </section>

    </main>

    <div class="preview-overlay" id="previewOverlay" hidden>
      <div class="preview-backdrop"></div>
      <div class="preview-panel" id="previewPanel">
        <div class="preview-toolbar">
          <span class="preview-name" id="previewName"></span>
          <span class="tag tag-accent" id="previewStatus"></span>
          <span class="preview-host" id="previewHost"></span>
          <a class="btn btn-primary" id="previewOpenBtn" target="_blank" rel="noopener">Open app</a>
          <button class="btn btn-ghost btn-icon" id="previewCloseBtn" aria-label="Close preview">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M205.7 194.3a8 8 0 0 1-11.4 11.4L128 139.3l-66.3 66.4a8 8 0 0 1-11.4-11.4l66.4-66.3-66.4-66.3a8 8 0 0 1 11.4-11.4l66.3 66.4 66.3-66.4a8 8 0 0 1 11.4 11.4L139.3 128Z"></path></svg>
          </button>
        </div>
        <iframe id="previewFrame" class="preview-frame" title="App preview" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
